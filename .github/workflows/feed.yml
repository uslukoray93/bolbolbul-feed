name: Feed Guncelle

# Her gun 04:00 (Turkiye saati) = 01:00 UTC
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:        # "Run workflow" butonuyla elle de calistirilabilir

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Feed uret
        run: |
          python3 feed_duzelt.py --cikti yayin/google-feed.xml --stoksuz-cikar

      - name: Promosyon feed uret
        run: |
          python3 promosyon_uret.py --cikti yayin/promosyonlar.xml

      - name: ImageMagick kur
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Kucuk gorselleri buyut
        run: |
          # Onceki calismalardan kalan gorseller ve kayit dosyasi (varsa) geri yuklenir
          mkdir -p yayin/img
          if [ -d gorseller ]; then cp -a gorseller/. yayin/img/ 2>/dev/null || true; fi
          python3 gorsel_buyut.py \
            --feed   yayin/google-feed.xml \
            --klasor yayin/img \
            --taban  "https://uslukoray93.github.io/bolbolbul-feed/img" \
            --limit  ${{ vars.GORSEL_LIMIT || '50' }} \
            ${{ vars.GORSEL_FILTRE && format('--filtre {0}', vars.GORSEL_FILTRE) || '' }}

      - name: Feed'i buyutulmus gorsellerle yeniden uret
        run: |
          python3 feed_duzelt.py --cikti yayin/google-feed.xml --stoksuz-cikar \
            --gorsel-kayit yayin/img/_kayit.json

      - name: Dogrula
        run: |
          python3 - <<'PY'
          import re, sys, os, xml.etree.ElementTree as ET
          f = 'yayin/google-feed.xml'
          ET.parse(f)                                   # XML gecerli mi
          d = open(f, encoding='utf-8').read()
          adet = d.count('<item>')

          kontrol = [
            ('out of stock kalmadi',     '<g:availability>out of stock</g:availability>' not in d),
            ('installment kalmadi',      '<g:installment>' not in d),
            ('TR-format fiyat kalmadi',  not re.search(r'<g:price>[\d.]+,\d\d', d)),
            ('fiyatlar TRY birimli',     len(re.findall(r'<g:price>[\d]+\.\d\d TRY</g:price>', d)) == d.count('<g:price>')),
            ('kategoriler sayisal ID',   not re.search(r'<g:google_product_category>[^\d<]', d)),
            ('aciklamada HTML yok',      '&lt;div' not in d and '&lt;span' not in d),
          ]
          hata = False
          for ad, ok in kontrol:
              print(('  OK   ' if ok else '  HATA ') + ad)
              hata |= not ok

          if adet < 4000:
              print(f'  HATA  Sadece {adet} urun var (min 4000)')
              hata = True

          print(f'\n  Urun: {adet}  |  Boyut: {os.path.getsize(f)/1024/1024:.1f} MB')
          if hata:
              print('\nDOGRULAMA BASARISIZ - eski feed korunacak')
              sys.exit(1)
          PY

      - name: GitHub Pages yapilandir
        uses: actions/configure-pages@v5

      - name: Dosyalari yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: yayin

      - name: Yayinla
        id: yayinla
        uses: actions/deploy-pages@v4

      - name: Depoya iz birak (60 gun kurali)
        run: |
          mkdir -p durum
          {
            echo "son_calisma: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "urun_sayisi: $(grep -c '<item>' yayin/google-feed.xml)"
            echo "boyut: $(du -h yayin/google-feed.xml | cut -f1)"
          } > durum/son-calisma.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p gorseller
          cp -a yayin/img/. gorseller/ 2>/dev/null || true
          git add durum/son-calisma.txt gorseller
          git diff --staged --quiet || git commit -m "feed guncellendi [skip ci]"
          git push

      - name: Canli feed kontrolu
        run: |
          URL="${{ steps.yayinla.outputs.page_url }}google-feed.xml"
          echo "Kontrol ediliyor: $URL"
          # Pages'in yayilmasi icin 30 sn bekle, 5 deneme
          for i in 1 2 3 4 5; do
            sleep 30
            KOD=$(curl -sL -o canli.xml -w '%{http_code}' "$URL" || echo 000)
            echo "  deneme $i -> HTTP $KOD"
            [ "$KOD" = "200" ] && break
          done
          python3 - <<'PY'
          import os, sys, email.utils
          from datetime import datetime, timezone
          import xml.etree.ElementTree as ET

          f = 'canli.xml'
          if not os.path.exists(f) or os.path.getsize(f) < 1000:
              print('HATA: Canli feed indirilemedi'); sys.exit(1)

          ch = ET.parse(f).getroot().find('channel')
          adet = len(ch.findall('item'))
          tarih = ch.findtext('lastBuildDate')
          uretim = email.utils.parsedate_to_datetime(tarih)
          yas = (datetime.now(timezone.utc) - uretim).total_seconds() / 3600

          print(f'  Urun     : {adet}')
          print(f'  Uretim   : {tarih}')
          print(f'  Yas      : {yas:.1f} saat')

          if adet < 4000:
              print(f'HATA: Canli feedde sadece {adet} urun var'); sys.exit(1)
          if yas > 72:
              print(f'HATA: Feed {yas/24:.1f} gundur guncellenmemis (limit 3 gun)'); sys.exit(1)
          print('  DURUM    : saglikli')
          PY

      - name: Ozet
        if: always()
        run: |
          if [ -f yayin/google-feed.xml ]; then
            echo "### Feed guncellendi" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Urun: $(grep -c '<item>' yayin/google-feed.xml)" >> $GITHUB_STEP_SUMMARY
            echo "- Boyut: $(du -h yayin/google-feed.xml | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "- Urun feed: ${{ steps.yayinla.outputs.page_url }}google-feed.xml" >> $GITHUB_STEP_SUMMARY
            echo "- Promosyon feed: ${{ steps.yayinla.outputs.page_url }}promosyonlar.xml" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Feed URETILEMEDI - eski feed yayinda kaliyor" >> $GITHUB_STEP_SUMMARY
          fi
